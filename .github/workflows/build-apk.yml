name: Build War Iran APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout War Iran Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Compatible Arc Engine
        run: |
          git clone https://github.com/Anuken/Arc.git ../Arc
          cd ../Arc
          git checkout 7445105cd2

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :android:assembleRelease --stacktrace

      - name: Upload War Iran APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarIran-Final-APK
          path: android/build/outputs/apk/release/*.apk
