name: Build War Iran APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout WarIran Repository
      uses: actions/checkout@v4
      with:
        path: WARIRAN

    - name: Clone Compatible Arc Engine
      run: |
        git clone --depth 1 https://github.com/Anuken/Arc.git Arc

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android APK
      working-directory: WARIRAN
      run: |
        chmod +x gradlew
        ./gradlew android:assembleDebug -Pbuildversion=146 --stacktrace

    - name: Upload WarIran APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WarIran-Fixed-APK
        path: WARIRAN/android/build/outputs/apk/debug/*.apk
