name: Build War Iran APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout WarIran Repository
      uses: actions/checkout@v4
      with:
        path: WARIRAN

    - name: Clone Compatible Arc Engine
      run: |
        git clone --branch v146 --depth 1 https://github.com/Anuken/Arc.git Arc

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Publish Arc v146 to Local Maven
      working-directory: Arc
      run: |
        chmod +x gradlew
        ./gradlew publishToMavenLocal -x test

    - name: Build Android APK
      working-directory: WARIRAN
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        chmod +x gradlew
        ./gradlew android:assembleDebug -Pbuildversion=146 --stacktrace

    - name: Upload WarIran APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WarIran-Fixed-APK
        path: WARIRAN/android/build/outputs/apk/debug/*.apk
