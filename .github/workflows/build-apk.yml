name: Build War Iran APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Checkout Matching Arc
      run: |
        cd ..
        git clone --depth 1 https://github.com/Anuken/Arc.git Arc

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Android Debug APK
      run: ./gradlew android:assembleDebug -x test

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WarIran-Fixed-APK
        path: android/build/outputs/apk/debug/*.apk
